<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta 스터디</title>
    <script>
        // 깜빡임 방지: 화면을 그리기 전에 저장된 테마를 적용
        try { if (localStorage.getItem('delta:theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) { /* 무시 */ }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; touch-action: manipulation; }
        .auto-active { background-color: #f97316 !important; color: white !important; border-color: #f97316 !important; }
        .card-container { min-height: 380px; display: flex; flex-direction: column; justify-content: center; }
        .card-tall { min-height: 420px; } /* 대화형/혼합 Day: 역할 배지와 맥락 박스 공간 */
        #progress-container { cursor: pointer; touch-action: none; }
        #prev-item-box { transition: all 0.5s ease; min-height: 48px; }
        #day-select { text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .mode-btn-active { background-color: #0f172a !important; color: white !important; border-color: #0f172a !important; }

        /* 🌙 다크 모드: <html class="dark">일 때 Tailwind 색 클래스를 다시 매핑 (마크업과 JS 클래스 모두 적용) */
        html.dark { color-scheme: dark; }
        html.dark .bg-slate-50 { background-color: #020617; }
        html.dark .bg-white { background-color: #0f172a; }
        html.dark .bg-slate-100 { background-color: #1e293b; }
        html.dark .bg-slate-200 { background-color: #334155; }
        html.dark .bg-gray-200 { background-color: #334155; }
        html.dark .bg-slate-900 { background-color: #e2e8f0; color: #0f172a !important; }
        html.dark .mode-btn-active { background-color: #e2e8f0 !important; color: #0f172a !important; border-color: #e2e8f0 !important; }
        html.dark .bg-blue-50 { background-color: rgba(30, 58, 138, 0.35); }
        html.dark .bg-orange-100 { background-color: rgba(124, 45, 18, 0.4); }
        html.dark .border-slate-100, html.dark .border-slate-50 { border-color: #1e293b; }
        html.dark .decoration-slate-100 { text-decoration-color: #334155; }
        html.dark .text-slate-900 { color: #f1f5f9; }
        html.dark .text-slate-800 { color: #e2e8f0; }
        html.dark .text-slate-700, html.dark .text-slate-600 { color: #cbd5e1; }
        html.dark .text-slate-500, html.dark .text-slate-400 { color: #94a3b8; }
        html.dark .text-slate-300 { color: #64748b; }
        html.dark .text-blue-600, html.dark .text-blue-500, html.dark .text-blue-400 { color: #60a5fa; }
        html.dark .text-blue-300 { color: #93c5fd; }
        html.dark .text-orange-600 { color: #fb923c; }
        html.dark .text-emerald-600 { color: #34d399; }
        html.dark .text-rose-500 { color: #fb7185; }
        html.dark .hover\:bg-slate-50:hover { background-color: #1e293b; }
        html.dark .hover\:bg-slate-200:hover { background-color: #334155; }
        html.dark .translate-x-5, html.dark .translate-x-0\.5 { background-color: #e2e8f0; } /* 토글 스위치 손잡이 */
        html.dark select option { background-color: #0f172a; color: #e2e8f0; }
        /* 영작 입력창: 브라우저 기본 흰 배경이 남지 않도록 지정 (입력한 글자가 보이게) */
        html.dark input[type="text"] { background-color: #0f172a; color: #f1f5f9; border-color: #334155; }
        html.dark input[type="text"]::placeholder { color: #64748b; }
        html.dark input[type="text"]:disabled { background-color: #1e293b; color: #f1f5f9; -webkit-text-fill-color: #f1f5f9; opacity: 1; }

        /* ⏱ 자동 게이지 바 실시간 애니메이션 */
        #timer-gauge-bar {
            transition: width 50ms linear;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-start p-4">

    <!-- [1] 설정 화면 -->
    <div id="setup-screen" class="bg-white p-5 rounded-[2.5rem] shadow-2xl max-w-sm w-full border border-slate-100 my-auto text-center">
        <!-- 앱 이름 배지 오른쪽: 다크 모드 토글 -->
        <!-- 상단 유틸리티 줄: 영작 모드(왼쪽), 다크 모드(오른쪽)를 같은 알약 모양으로 대칭 배치 -->
        <div class="flex items-center justify-between gap-2 mb-3">
            <button id="grade-mode-btn" role="switch" aria-checked="false" onclick="toggleGradeMode()" class="shrink-0 min-w-[8.25rem] flex items-center justify-center gap-2 min-h-[44px] px-3 rounded-full border-2 border-slate-100 bg-white font-bold text-xs text-slate-600 transition-all hover:bg-slate-50"></button>
            <button type="button" id="theme-toggle" role="switch" aria-checked="false" onclick="toggleTheme()" aria-label="다크 모드" class="shrink-0 min-w-[8.25rem] flex items-center justify-center gap-2 min-h-[44px] px-3 rounded-full border-2 border-slate-100 bg-white font-bold text-xs text-slate-600 transition-all hover:bg-slate-50">🌙 다크</button>
        </div>
        <div class="mb-2 flex justify-center">
            <span class="bg-orange-100 text-orange-600 px-4 py-1 rounded-full text-xs font-bold inline-block uppercase tracking-widest">Delta 스터디</span>
        </div>
        <h1 id="setup-day-title" class="text-xl font-black text-slate-800 text-center mb-4">Day 자료</h1>

        <!-- 범위: 단일 Day 또는 기간(시작~끝 드롭다운). 목록은 data/days.json 기준 -->
        <div class="mb-4 px-1 space-y-3 text-left">
            <div class="flex items-center gap-2.5">
                <p class="w-[4.5rem] shrink-0 text-slate-700 font-bold text-sm">범위 선택</p>
                <div class="flex-1 min-w-0 grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl">
                    <button type="button" id="scope-single" onclick="selectScope('single')" class="py-3.5 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm">단일 Day</button>
                    <button type="button" id="scope-range" onclick="selectScope('range')" class="py-3.5 rounded-xl font-bold text-xs text-slate-500 transition-all hover:text-slate-900">기간 설정</button>
                </div>
            </div>
            <div id="single-box" class="flex items-center gap-2.5">
                <label for="day-select" class="w-[4.5rem] shrink-0 text-slate-700 font-bold text-sm">Day 선택</label>
                <select id="day-select" class="flex-1 min-w-0 w-full py-3 px-4 rounded-2xl border-2 border-slate-100 font-bold text-slate-700 bg-white outline-none focus:border-blue-400 disabled:opacity-60"></select>
            </div>
            <div id="range-box" class="hidden flex items-center gap-2.5">
                <p class="w-[4.5rem] shrink-0 text-slate-700 font-bold text-sm">기간 선택</p>
                <div class="flex-1 min-w-0 flex items-center gap-1.5">
                    <label for="range-start" class="sr-only">시작 Day</label>
                    <select id="range-start" class="flex-1 min-w-0 py-3 px-2 rounded-2xl border-2 border-slate-100 font-bold text-sm text-slate-700 bg-white outline-none focus:border-blue-400 disabled:opacity-60"></select>
                    <span class="shrink-0 text-slate-400 font-bold text-sm">~</span>
                    <label for="range-end" class="sr-only">끝 Day</label>
                    <select id="range-end" class="flex-1 min-w-0 py-3 px-2 rounded-2xl border-2 border-slate-100 font-bold text-sm text-slate-700 bg-white outline-none focus:border-blue-400 disabled:opacity-60"></select>
                </div>
            </div>
        </div>

        <!-- 학습모드 / 반복 단위 / 문제 범위 / 문제 필터 -->
        <!-- 제목은 왼쪽, 선택지는 오른쪽에 한 줄로 둔다 (모바일 한 화면 맞춤) -->
        <div class="mb-3 px-1 space-y-3 text-left">
            <div class="flex items-center gap-2.5">
                <p class="w-[4.5rem] shrink-0 text-slate-700 font-bold text-sm">학습 모드</p>
                <div class="flex-1 min-w-0 grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl">
                    <button type="button" id="tab-ladder" onclick="selectPlayMode('ladder')" class="py-3.5 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm">
                        🪜 사다리 모드
                    </button>
                    <button type="button" id="tab-random" onclick="selectPlayMode('random')" class="py-3.5 rounded-xl font-bold text-xs text-slate-500 transition-all hover:text-slate-900">
                        🎲 랜덤 출제 모드
                    </button>
                </div>
            </div>

            <!-- 반복 단위 (사다리 모드 전용): 맨 왼쪽 '교재'는 번호 묶음 단위, 1~8은 그 개수씩 누적 반복 (기본 4) -->
            <div id="chunk-setting-box" class="flex items-center gap-2.5 min-h-[44px] transition-all">
                <p class="w-[4.5rem] shrink-0 text-slate-700 font-bold text-sm">반복 단위</p>
                <input type="range" id="chunk-slider" min="0" max="8" value="4" oninput="updateChunkDisplay(this.value)" class="flex-1 min-w-0 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                <div class="shrink-0 min-w-[2.75rem] text-center bg-blue-600 text-white px-2 py-0.5 rounded-lg font-black text-base" id="chunk-value">4</div>
            </div>

            <div class="flex items-center gap-2.5">
                <p class="w-[4.5rem] shrink-0 text-slate-700 font-bold text-sm">문제 범위</p>
                <div class="flex-1 min-w-0 grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl">
                    <button type="button" id="pool-all" onclick="selectPoolMode('all')" class="py-3.5 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm">
                        📚 전체 문항
                    </button>
                    <button type="button" id="pool-wrong" onclick="selectPoolMode('wrong')" class="py-3.5 rounded-xl font-bold text-xs text-slate-500 transition-all hover:text-slate-900">
                        ❌ 틀린 문제 <span id="wrong-count">0</span>개
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <p class="w-[4.5rem] shrink-0 text-slate-700 font-bold text-sm">문제 필터</p>
                <div class="flex-1 min-w-0 grid grid-cols-3 gap-2 bg-slate-100 p-1.5 rounded-2xl">
                    <button type="button" id="parity-all" onclick="selectParity('all')" class="py-3.5 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm">전체</button>
                    <button type="button" id="parity-odd" onclick="selectParity('odd')" class="py-3.5 rounded-xl font-bold text-xs text-slate-500 transition-all hover:text-slate-900">홀수</button>
                    <button type="button" id="parity-even" onclick="selectParity('even')" class="py-3.5 rounded-xl font-bold text-xs text-slate-500 transition-all hover:text-slate-900">짝수</button>
                </div>
            </div>
        </div>
        <!-- 한 줄 힌트: 경고가 있으면 경고, 없으면 현재 선택 설명. 데이터를 불러오는 중이거나 실패했을 때 상태 문구도 여기에 나온다 -->
        <p id="setup-hint" class="text-[11px] font-semibold text-slate-400 mb-3 px-1 text-left min-h-[16px]"></p>

        <div class="mt-6 space-y-2">
        <button id="resume-btn" onclick="resumeStudy()" class="hidden w-full bg-blue-600 text-white py-3 rounded-2xl font-bold text-sm shadow-lg active:scale-95 transition-all"></button>
        <button onclick="startStudy()" class="w-full bg-slate-900 text-white py-3 rounded-2xl font-bold text-base shadow-xl active:scale-95 transition-all">연습 새로 시작하기</button>
        </div>
    </div>

    <!-- [2] 학습 화면 -->
    <div id="study-screen" class="hidden w-full max-w-lg text-slate-900 mx-auto">
        <div class="flex justify-between items-center mb-4 px-2">
            <button onclick="goHome()" title="홈 (진행 저장 유지)" class="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1v4a1 1 0 001 1m-6 0h6" /></svg>
            </button>
            <div id="active-lesson-name" class="text-slate-400 font-black text-xs tracking-widest uppercase text-center flex-1"></div>
            <div class="w-10"></div>
        </div>

        <!-- 직전 학습 문장 표시 영역 -->
        <div id="prev-item-box" class="w-full px-8 mb-2 flex flex-col items-center justify-center text-center opacity-0">
            <p id="prev-kr" class="text-xs font-bold text-slate-400 truncate w-full"></p>
            <p id="prev-en" class="text-xs font-black text-blue-300 truncate w-full"></p>
        </div>

        <div id="study-card" class="bg-white p-10 rounded-[3rem] shadow-2xl card-container text-center mb-6 border border-slate-50 relative overflow-hidden">
            <!-- ⏳ 자동 타이머 게이지 바 -->
            <div id="timer-gauge-container" class="absolute top-0 left-0 right-0 h-1.5 bg-slate-100 hidden overflow-hidden">
                <div id="timer-gauge-bar" class="h-full bg-orange-500 w-full"></div>
            </div>

            <div class="absolute top-6 left-8 right-8 flex justify-between items-center">
                <div class="flex items-center gap-1.5">
                    <span id="sentence-number" class="bg-slate-100 text-slate-500 px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-tighter">No.1.(1)</span>
                    <span id="speaker-badge" class="hidden px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-tight text-white"></span>
                </div>
                <div class="flex items-center gap-2">
                    <span id="badge-playmode" class="text-[9px] font-black px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 uppercase tracking-tighter">사다리</span>
                    <button onclick="switchModeInGame()" id="mode-switch-btn" class="text-slate-300 font-bold text-[10px] underline decoration-slate-100 hover:text-blue-400 transition-colors">자동 모드 전환</button>
                    <div id="mode-status" class="text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-50 text-slate-300 uppercase tracking-tighter transition-all">수동</div>
                </div>
            </div>

            <!-- 대화형: B 차례에 A의 대사를 맥락으로 보여줌 -->
            <div id="context-box" class="hidden mb-5 p-3.5 bg-slate-50 border border-slate-100 rounded-2xl text-left">
                <p id="context-kr" class="text-xs font-bold text-slate-500 mb-0.5"></p>
                <p id="context-en" class="text-xs font-black text-blue-500"></p>
            </div>

            <div class="flex items-center justify-center gap-2 mb-8">
                <span id="role-tag" class="hidden w-7 h-7 rounded-full text-white font-black text-xs flex items-center justify-center shadow-sm shrink-0"></span>
                <div id="kr-box" class="text-2xl font-bold text-slate-800 leading-relaxed break-keep px-2"></div>
            </div>
            <!-- ✍️ 영작 입력 (영작 모드 ON일 때만 표시) -->
            <div id="answer-box" class="hidden w-full mb-6 px-2">
                <input id="answer-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 써 보세요 (Enter 제출)"
                       class="w-full border-2 border-slate-100 rounded-2xl px-4 py-3 text-lg font-bold text-slate-800 text-center outline-none focus:border-blue-400 disabled:bg-slate-50">
            </div>
            <div id="en-box" class="invisible opacity-0 translate-y-4 transition-all duration-500 w-full text-center">
                <div class="h-[1px] bg-slate-100 w-16 mx-auto mb-8"></div>
                <p id="judge-text" class="hidden text-sm font-black mb-3 break-keep px-4"></p>
                <p id="en-text" class="text-2xl font-black text-blue-600 leading-tight break-keep px-4"></p>
            </div>
            <div id="finish-ui" class="hidden absolute inset-0 bg-white z-50 flex flex-col p-5 text-center rounded-[3rem] overflow-hidden">
                <!-- 1단계: 연습 완료 요약 -->
                <div id="finish-main" class="m-auto w-full">
                    <p class="text-3xl mb-1">🎉</p>
                    <h2 class="text-xl font-black mb-4 text-slate-800">연습 완료!</h2>
                    <button id="cal-confirm-btn" class="w-full bg-blue-600 text-white py-3.5 rounded-2xl font-bold shadow-lg mb-2">복습 알림 예약하기</button>
                    <!-- 틀린 문제로 연습한 경우에만 표시 -->
                    <button id="wrong-open-btn" onclick="showFinishView('cleanup')" class="hidden w-full py-3.5 rounded-2xl font-bold text-sm text-slate-700 border-2 border-slate-100 transition-all hover:bg-slate-50 mb-2">❌ 틀린 문제 목록 정리</button>
                    <button onclick="quitStudy()" class="text-slate-400 text-sm font-bold py-2">그냥 종료하기</button>
                </div>

                <!-- 2단계: 틀린 문제 목록 정리 (한 화면 안에 들어가도록 짧게 구성) -->
                <div id="finish-cleanup" class="hidden flex-col h-full min-h-0 w-full text-left">
                    <div class="flex items-center justify-between mb-2">
                        <button type="button" onclick="showFinishView('main')" class="text-slate-500 font-bold text-sm min-h-[44px] px-2">← 뒤로</button>
                        <h2 class="font-black text-base text-slate-800">틀린 문제 정리</h2>
                        <span class="w-14"></span>
                    </div>
                    <p class="text-[11px] font-semibold text-slate-400 mb-2 text-center">체크한 문제를 목록에서 지우고, 나머지는 남겨둘게요</p>
                    <!-- 전체 선택: 설명 문구 아래의 체크박스 (문제 체크박스와 같은 크기) -->
                    <label id="wrong-select-row" class="inline-flex items-center gap-3 min-h-[44px] px-3 py-2 mb-1 border-2 border-transparent rounded-xl self-start cursor-pointer">
                        <input id="wrong-select-all" type="checkbox" class="w-5 h-5 shrink-0 accent-blue-600" onchange="toggleSelectAllWrong(this.checked)">
                        <span id="wrong-select-text" class="text-xs font-bold text-slate-700">전체 선택</span>
                    </label>
                    <div id="wrong-pick-list" class="flex-1 min-h-0 overflow-y-auto space-y-2 pr-1"></div>
                    <div id="wrong-actions" class="grid grid-cols-2 gap-2 mt-3">
                        <button type="button" onclick="clearWrongAll()" class="min-h-[44px] rounded-xl font-bold text-xs text-rose-500 border-2 border-slate-100 transition-all hover:bg-slate-50">전체 비우기</button>
                        <button type="button" onclick="removePickedWrong()" class="min-h-[44px] rounded-xl font-bold text-xs bg-slate-900 text-white active:scale-95 transition-all">체크한 문제 지우기</button>
                    </div>
                    <!-- 정리할 문제가 없으면 홈으로 바로 돌아가기 -->
                    <button id="wrong-home-btn" type="button" onclick="quitStudy()" class="hidden w-full mt-3 min-h-[44px] rounded-xl font-bold text-sm bg-blue-600 text-white shadow-lg active:scale-95 transition-all">홈으로 돌아가기</button>
                    <p id="wrong-cleanup-msg" class="text-center text-xs font-bold text-blue-600 mt-2 min-h-[16px]"></p>
                </div>
            </div>
        </div>

        <div id="control-panel" class="flex flex-col gap-3 mb-6">
            <div class="flex gap-2">
                <button onclick="prevStep()" id="prev-btn" class="w-16 bg-white border-2 border-slate-100 text-slate-300 py-5 rounded-[1.8rem] font-black text-xl active:scale-95 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <button onclick="handleAction()" id="main-btn" class="flex-1 bg-slate-900 text-white py-5 rounded-[1.8rem] font-black text-lg shadow-2xl active:scale-95 transition-all">정답 확인</button>
            </div>
        </div>

        <div id="progress-container" class="h-4 flex items-center w-full mb-2">
            <div class="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden pointer-events-none">
                <div id="progress-bar" class="h-full bg-orange-500 transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
        <p id="progress-text" class="text-center text-slate-400 text-[9px] font-bold uppercase tracking-widest pointer-events-none">Step 1 / 00</p>
        <p id="key-hint" class="text-center text-slate-300 text-[9px] font-bold tracking-widest pb-6 pointer-events-none">Space / Enter 다음 · ← 이전</p>
    </div>

    <script>

        let playMode = 'ladder';  // 'ladder' | 'random'  (학습 방식)
        let poolMode = 'all';     // 'all' | 'wrong'      (문제 범위)
        let parity = 'all';       // 'all' | 'odd' | 'even' (그룹 문제 필터)
        let gradeOn = false;      // 영작 모드 여부
        let studySequence = [], currentIdx = 0, subStep = 0;
        // 반복 단위(사다리 전용): 0 = 교재 순(번호 그룹 단위), 1~8 = 항목을 그 개수씩 누적 반복. 기본 4
        let selectedChunkSize = 4;
        let isAutoMode = false;

        // ⏱ 자동 타이머 제어 변수 (문장형/대화형 값은 원본 페이지를 따름)
        let autoGaugeTimer = null;
        const TIMING = {
            sentence: { think: 4500, confirm: 3000 }, // 문장형: 생각 4.5초 / 정답 확인 3.0초
            dialogue: { think: 4000, confirm: 2500 }  // 대화형: 생각 4.0초 / 정답 확인 2.5초
        };
        const timingFor = item => TIMING[isDialogueItem(item) ? 'dialogue' : 'sentence'];

        // 🧩 단계 규칙
        // 문장 1개 = 2단계 [문제, 정답 공개]
        // 대화 1세트 = 4단계 [A 문제, A 정답, B 문제(맥락 포함), B 정답]
        const isDialogueItem = item => item.type === 'dialogue';
        const stepsOf = item => isDialogueItem(item) ? 4 : 2;
        const isQuestionStep = () => subStep % 2 === 0;
        // 정답 채점 대상: 문장형은 en, 대화형은 A 차례 a_en / B 차례 b_en
        const answerFor = (item, step) => isDialogueItem(item) ? (step < 2 ? item.a_en : item.b_en) : item.en;

        // ── 설정 화면 ─────────────────────────────────────────
        const SEG_ON = "py-3.5 rounded-xl font-black text-xs transition-all mode-btn-active shadow-sm";
        const SEG_OFF = "py-3.5 rounded-xl font-bold text-xs text-slate-500 transition-all hover:text-slate-900";

        function setSeg(ids, activeId) {
            ids.forEach(id => { document.getElementById(id).className = id === activeId ? SEG_ON : SEG_OFF; });
        }

        function selectPlayMode(mode) { playMode = mode; refreshSetup(); }
        function selectPoolMode(pool) { poolMode = pool; refreshSetup(); }
        function selectParity(p) { parity = p; refreshSetup(); }

        function updateChunkDisplay(val) {
            selectedChunkSize = parseInt(val, 10);
            document.getElementById('chunk-value').innerText = selectedChunkSize === 0 ? '교재' : String(selectedChunkSize);
            updateSetupHint();
        }

        // 번호 앞쪽 정수 = 그룹 (예: "3.(2)" → 3, "14" → 14). 홀수/짝수 필터에 사용
        const groupOf = item => parseInt(item.num, 10);
        // 교재 순 묶음 키: Day가 달라도 같은 번호는 다른 묶음 (예: "day04#3")
        const dayOfItem = item => item.id.split(':')[0];
        const groupKey = item => `${dayOfItem(item)}#${parseInt(item.num, 10)}`;

        // 설정값으로 연습 순서를 만든다. 설정 화면의 "총 N단계"와 시작 버튼이 같은 함수를 쓴다
        function buildSequence(pool) {
            if (playMode === 'random') return shuffleArray(pool).map(item => ({ data: item }));
            // 틀린 문제는 사다리 반복 없이 교재 순서대로 1번씩
            if (poolMode === 'wrong') return pool.map(item => ({ data: item }));
            return selectedChunkSize === 0 ? buildGroupLadder(pool) : buildLadder(pool, selectedChunkSize);
        }

        // 설정 화면 한 줄 힌트: 경고가 있으면 경고, 없으면 현재 선택과 총 단계 수
        function updateSetupHint() {
            const el = document.getElementById('setup-hint');
            const warn = poolMode === 'wrong' && !gradeOn;
            el.classList.toggle('text-orange-600', warn);
            el.classList.toggle('font-bold', warn);
            el.classList.toggle('text-slate-400', !warn);
            if (warn) { el.innerText = '⚠️ 영작 모드를 켜야 오답노트가 자동으로 정리돼요.'; return; }
            const pool = getPool();
            if (playMode === 'random') { el.innerText = `${dayUnit()} ${pool.length}개를 중복 없이 무작위로 출제해요.`; return; }
            const steps = buildSequence(pool).length;
            const how = poolMode === 'wrong' ? '틀린 문제를 교재 순으로 1번씩'
                : selectedChunkSize === 0 ? '교재 번호 묶음 단위로 반복해요'
                : `${selectedChunkSize}${dayUnit()}씩 묶어서 반복해요`;
            el.innerText = `${how} · 총 ${steps}단계`;
        }

        // 설정 화면 전체 상태를 현재 값에 맞춰 갱신
        function refreshSetup() {
            setSeg(['tab-ladder', 'tab-random'], playMode === 'ladder' ? 'tab-ladder' : 'tab-random');
            setSeg(['parity-all', 'parity-odd', 'parity-even'], parity === 'odd' ? 'parity-odd' : parity === 'even' ? 'parity-even' : 'parity-all');
            setSeg(['scope-single', 'scope-range'], scope === 'range' ? 'scope-range' : 'scope-single');
            document.getElementById('single-box').classList.toggle('hidden', scope !== 'single');
            document.getElementById('range-box').classList.toggle('hidden', scope !== 'range');

            // 선택한 범위에 틀린 문제가 없으면 오답 범위를 고를 수 없음
            const wrongInScope = dayItems.filter(item => wrongSet.has(item.id)).length;
            if (poolMode === 'wrong' && wrongInScope === 0) poolMode = 'all';
            const wrongBtn = document.getElementById('pool-wrong');
            wrongBtn.disabled = wrongInScope === 0;
            wrongBtn.classList.toggle('opacity-40', wrongBtn.disabled);
            document.getElementById('wrong-count').innerText = wrongInScope;
            setSeg(['pool-all', 'pool-wrong'], poolMode === 'wrong' ? 'pool-wrong' : 'pool-all');

            // 반복 단위는 사다리 모드에서만 의미가 있음
            document.getElementById('chunk-setting-box').classList.toggle('hidden', playMode !== 'ladder');
            document.getElementById('chunk-slider').value = String(selectedChunkSize);
            document.getElementById('chunk-value').innerText = selectedChunkSize === 0 ? '교재' : String(selectedChunkSize);
            updateSetupHint();
        }

        // 🔘 토글 스위치 렌더링: 라벨 + 스위치 (aria-checked로 상태 노출)
        function renderSwitch(btn, label, on, onColor) {
            btn.setAttribute('aria-checked', String(on));
            btn.innerHTML = `<span>${label}</span>
                <span class="relative inline-flex h-6 w-10 shrink-0 items-center rounded-full transition-colors ${on ? onColor : 'bg-slate-200'}">
                    <span class="inline-block h-5 w-5 rounded-full bg-white shadow transition-transform ${on ? 'translate-x-5' : 'translate-x-0.5'}"></span>
                </span>`;
        }

        function toggleGradeMode() {
            gradeOn = !gradeOn;
            applyGradeUI();
            refreshSetup(); // 설정 화면의 영작 모드 경고 갱신
        }

        // 영작 모드 중에는 자동 재생과 함께 쓰지 않음 (입력 시간과 타이머가 충돌)
        function applyGradeUI() {
            renderSwitch(document.getElementById('grade-mode-btn'), '영작 모드', gradeOn, 'bg-blue-600');

            // 영작 모드 중에는 자동 재생을 쓰지 않는다 (자동 재생 설정은 제거됨)
            if (gradeOn) isAutoMode = false;

            document.getElementById('mode-switch-btn').classList.toggle('hidden', gradeOn);
            document.getElementById('key-hint').innerText = gradeOn
                ? 'Enter 채점 · Space/Enter 다음 · ← 이전'
                : 'Space / Enter 다음 · ← 이전';
        }

        function switchModeInGame() {
            isAutoMode = !isAutoMode;
            updateInGameModeUI();
            if (isAutoMode) {
                const item = studySequence[currentIdx].data;
                const t = timingFor(item);
                runAutoGauge(isQuestionStep() ? t.think : t.confirm);
            } else {
                stopAutoGauge();
            }
        }

        function updateInGameModeUI() {
            const status = document.getElementById('mode-status');
            const switchBtn = document.getElementById('mode-switch-btn');
            if(isAutoMode) {
                status.innerText = "자동";
                status.className = "text-[9px] font-black px-2 py-0.5 rounded-full bg-orange-100 text-orange-600 uppercase tracking-tighter";
                switchBtn.innerText = "수동 전환";
            } else {
                status.innerText = "수동";
                status.className = "text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-50 text-slate-300 uppercase tracking-tighter";
                switchBtn.innerText = "자동 전환";
            }
        }

        // ⏱ 타이머 게이지 바 시작 함수
        function runAutoGauge(duration) {
            stopAutoGauge();
            if (!isAutoMode) return;

            const container = document.getElementById('timer-gauge-container');
            const bar = document.getElementById('timer-gauge-bar');
            container.classList.remove('hidden');

            bar.style.transition = 'none';
            bar.style.width = '100%';

            const startTime = Date.now();
            const tickInterval = 50;

            requestAnimationFrame(() => {
                bar.style.transition = `width ${tickInterval}ms linear`;
            });

            autoGaugeTimer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, duration - elapsed);
                const percent = (remaining / duration) * 100;
                bar.style.width = `${percent}%`;

                if (remaining <= 0) {
                    stopAutoGauge();
                    handleAction();
                }
            }, tickInterval);
        }

        // ⏱ 타이머 게이지 바 중단 함수
        function stopAutoGauge() {
            if (autoGaugeTimer) {
                clearInterval(autoGaugeTimer);
                autoGaugeTimer = null;
            }
            const container = document.getElementById('timer-gauge-container');
            const bar = document.getElementById('timer-gauge-bar');
            if (container) container.classList.add('hidden');
            if (bar) bar.style.width = '100%';
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // ── 문제 풀(pool) 구성 ────────────────────────────────
        // 문제 범위(전체/오답) → 문제 필터(홀수/짝수) 순서로 적용
        function getPool() {
            let pool = poolMode === 'wrong'
                ? dayItems.filter(item => wrongSet.has(item.id))
                : dayItems.slice();
            if (parity !== 'all') {
                pool = pool.filter(item => {
                    const group = parseInt(item.num, 10); // "3.(2)" → 3
                    return parity === 'odd' ? group % 2 === 1 : group % 2 === 0;
                });
            }
            return pool;
        }

        // 사다리 시퀀스: 덩어리(chunk) 안에서 정방향 누적 → 역방향 누적
        function buildLadder(pool, size) {
            const seq = [];
            for (let i = 0; i < pool.length; i += size) {
                const end = Math.min(i + size - 1, pool.length - 1);
                for (let j = i; j <= end; j++) {
                    for (let k = i; k <= j; k++) seq.push({ data: pool[k] });
                }
                if (end > i) {
                    for (let j = end; j >= i; j--) {
                        for (let k = end; k >= j; k--) seq.push({ data: pool[k] });
                    }
                }
            }
            return seq;
        }

        // 그룹 단위 사다리: 같은 그룹은 한 묶음, 문항이 1개뿐인 그룹이 연속되면 최대 4개씩 묶음
        function buildGroupLadder(pool) {
            const runs = [];
            for (const item of pool) {
                const last = runs[runs.length - 1];
                if (last && groupKey(last[0]) === groupKey(item)) last.push(item);
                else runs.push([item]);
            }
            const chunks = [];
            let singles = [];
            const flushSingles = () => {
                for (let i = 0; i < singles.length; i += 4) chunks.push(singles.slice(i, i + 4));
                singles = [];
            };
            for (const run of runs) {
                if (run.length === 1) singles.push(run[0]);
                else { flushSingles(); chunks.push(run); }
            }
            flushSingles();
            return chunks.flatMap(chunk => buildLadder(chunk, chunk.length));
        }

        function startStudy() {
            if (!dayItems.length) return; // 데이터 로딩 전이거나 실패한 경우
            const pool = getPool();
            if (pool.length === 0) {
                alert("선택한 조건에 해당하는 문항이 없습니다. (틀린 문제 + 홀수/짝수 조합 등을 확인해 주세요)");
                return;
            }
            // 진행 저장은 한 칸뿐이므로, 새로 시작하면 이전 진행이 지워진다는 것을 알린다
            if (loadProgress() && !confirm('이전에 연습하던 진행이 지워집니다. 새로 시작할까요?')) return;
            studySequence = buildSequence(pool);
            currentIdx = 0;
            enterStudy();
        }

        function sessionLabel() {
            const order = playMode === 'ladder' ? '사다리' : '랜덤';
            const pool = poolMode === 'wrong' ? ' · 오답' : '';
            const par = parity === 'odd' ? ' · 홀수' : parity === 'even' ? ' · 짝수' : '';
            return order + pool + par;
        }

        function enterStudy() {
            subStep = 0;
            visitIdx = -1;
            sessionFromWrong = poolMode === 'wrong';
            document.getElementById('badge-playmode').innerText = sessionLabel();
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('study-screen').classList.remove('hidden');
            initProgressControl();
            updateInGameModeUI();
            applyGradeUI();
            saveProgress();
            render();
        }

        // 📚 데이터 계층: data/days.json → data/dayNN.json (fetch, 로컬 서버 필요)
        const APP_NAME = 'Delta 스터디'; // 앱 이름 (배지·탭 제목)
        // 📊 방문 집계 설정 (기본은 꺼짐). url·key·hosts를 채워야 전송한다. 설정 방법은 docs/ANALYTICS.md
        const TRACK_CONFIG = { url: 'https://gftffitcsadeyhflbwjb.supabase.co', key: 'sb_publishable_LG3QAdFHFpKL2zm25TZ9wQ_DCKrqHi_', hosts: ['graditer.github.io'] }; // url: Supabase 주소, key: anon 공개 키, hosts: 전송을 허용할 배포 호스트
        const DEFAULT_DAY_ID = 'day08';
        let manifest = null;
        let scope = 'single';          // 'single': Day 하나 | 'range': 시작~끝 기간
        let selStart = DEFAULT_DAY_ID; // 선택한 시작 Day (manifest의 id)
        let selEnd = DEFAULT_DAY_ID;   // 선택한 끝 Day (단일 Day일 때는 selStart와 같음)
        let dayItems = [];             // 선택 범위의 항목 (Day 순서대로, Day 안에서는 교재 순)
        let itemById = new Map();      // dayItems의 ID → 항목
        const dayCache = new Map();    // Day id → 항목 배열 (한 번 받은 Day는 다시 받지 않음)
        const LAST_RANGE_KEY = 'delta:lastRange';

        async function loadManifest() {
            const res = await fetch('data/days.json', { cache: 'no-cache' });
            if (!res.ok) throw new Error(`days.json HTTP ${res.status}`);
            manifest = await res.json();
        }

        async function fetchDayItems(dayId) {
            if (dayCache.has(dayId)) return dayCache.get(dayId);
            const entry = dayEntry(dayId);
            if (!entry) throw new Error(`${dayId} 목록에 없음`);
            // 버전을 붙여서 GitHub Pages 등의 캐시 때문에 옛 데이터가 보이지 않게 함
            const res = await fetch(`${entry.file}?v=${manifest.version}`, { cache: 'no-cache' });
            if (!res.ok) throw new Error(`${entry.file} HTTP ${res.status}`);
            const items = (await res.json()).items;
            dayCache.set(dayId, items);
            return items;
        }

        // 선택(scope, selStart, selEnd)에 해당하는 Day id 목록 (manifest 순서)
        function dayIdsInScope() {
            if (scope === 'single') return [selStart];
            const a = manifest.days.findIndex(d => d.id === selStart);
            const b = manifest.days.findIndex(d => d.id === selEnd);
            return manifest.days.slice(Math.min(a, b), Math.max(a, b) + 1).map(d => d.id);
        }

        // 선택 범위의 항목을 모두 받아 dayItems를 만든다 (실패하면 dayItems는 그대로)
        async function loadSelection() {
            const lists = await Promise.all(dayIdsInScope().map(fetchDayItems));
            dayItems = lists.flat();
            itemById = new Map(dayItems.map(item => [item.id, item]));
        }

        // ── Day · 기간 선택 ───────────────────────────────────
        const dayEntry = dayId => manifest.days.find(d => d.id === dayId);
        const dayLabel = dayId => { const e = dayEntry(dayId); return `Day ${String(e.day).padStart(2, '0')}`; };
        // 선택 이름: "Day 03" 또는 "Day 03 ~ 05"
        const selectionLabel = () => scope === 'single' || selStart === selEnd
            ? dayLabel(selStart)
            : `${dayLabel(selStart)} ~ ${dayLabel(selEnd).replace('Day ', '')}`;
        // 항목 단위: 문장만이면 '문장', 대화형만이면 '세트', 섞이면 '항목'
        const dayUnit = () => {
            const hasDialogue = dayItems.some(isDialogueItem);
            const hasSentence = dayItems.some(item => !isDialogueItem(item));
            return hasDialogue && hasSentence ? '항목' : hasDialogue ? '세트' : '문장';
        };

        // 드롭다운 채우기: 단일 Day 목록, 기간의 시작·끝 목록 (끝은 시작보다 앞을 고를 수 없음)
        function renderSelectors() {
            const single = document.getElementById('day-select');
            single.innerHTML = '';
            for (const entry of manifest.days) {
                const opt = document.createElement('option');
                opt.value = entry.id;
                opt.innerText = `Day${String(entry.day).padStart(2, '0')} - ${entry.topic || entry.title}`;
                single.appendChild(opt);
            }
            single.value = selStart;

            const fill = (sel, from, value) => {
                sel.innerHTML = '';
                for (const entry of manifest.days.slice(from)) {
                    const opt = document.createElement('option');
                    opt.value = entry.id;
                    opt.innerText = dayLabel(entry.id);
                    sel.appendChild(opt);
                }
                sel.value = value;
            };
            const startIdx = manifest.days.findIndex(d => d.id === selStart);
            fill(document.getElementById('range-start'), 0, selStart);
            fill(document.getElementById('range-end'), startIdx, selEnd);
        }

        function setSetupBusy(busy) {
            ['day-select', 'range-start', 'range-end', 'scope-single', 'scope-range'].forEach(id => { document.getElementById(id).disabled = busy; });
            document.querySelector('#setup-screen button[onclick="startStudy()"]').disabled = busy;
        }

        // 범위를 바꾸고 데이터를 받아 설정 화면을 갱신한다 (실패하면 이전 선택으로 되돌림)
        async function applySelection(nextScope, nextStart, nextEnd) {
            const prev = { scope, selStart, selEnd };
            scope = nextScope;
            selStart = nextStart;
            selEnd = nextEnd;
            setSetupBusy(true);
            try {
                await loadSelection();
            } catch (err) {
                console.error(err);
                alert('Day 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
                ({ scope, selStart, selEnd } = prev);
                renderSelectors();
                return;
            } finally {
                setSetupBusy(false);
            }
            try { localStorage.setItem(LAST_RANGE_KEY, JSON.stringify({ scope, start: selStart, end: selEnd })); } catch (e) { /* 무시 */ }
            applyDayUI();
            renderSelectors();
            refreshSetup();
            updateResumeButton();
        }

        function selectScope(next) {
            if (next === scope) return;
            applySelection(next, selStart, next === 'single' ? selStart : selEnd);
        }

        // 기간: 끝이 시작보다 앞이면 끝을 시작에 맞춤
        function applyRange(startId, endId) {
            const a = manifest.days.findIndex(d => d.id === startId);
            const b = manifest.days.findIndex(d => d.id === endId);
            applySelection('range', startId, b < a ? startId : endId);
        }

        // 제목·라벨을 현재 선택에서 채움
        function updateTitles() {
            const sets = dayItems.filter(isDialogueItem).length;
            const sents = dayItems.length - sets;
            const count = sets && sents ? `총 ${dayItems.length}항목 · 세트 ${sets} · 문장 ${sents}` : `총 ${dayItems.length}${dayUnit()}`;
            document.title = `${APP_NAME} - ${selectionLabel()} 자료`;
            document.getElementById('setup-day-title').innerHTML = `${selectionLabel()} <span class="text-sm font-bold text-slate-400">(${count})</span>`;
            document.getElementById('active-lesson-name').innerText = `${selectionLabel()} 자료`;
        }

        // 반복 단위 기본값은 4 (Day나 기간이 바뀔 때마다 다시 4로)
        function applyLadderDefaults() {
            selectedChunkSize = 4;
        }

        function applyDayUI() {
            updateTitles();
            applyLadderDefaults();
        }

        function updateResumeButton() {
            const saved = loadProgress();
            const resumeBtn = document.getElementById('resume-btn');
            if (saved) {
                resumeBtn.innerText = `이어서 연습하기 (${saved.word} ${saved.currentIdx + 1} / ${saved.order.length})`;
                resumeBtn.classList.remove('hidden');
            } else {
                resumeBtn.classList.add('hidden');
            }
        }

        // 시작 선택: ?day=N 링크 → 마지막으로 연 선택 → 기본값 (Day 08)
        function resolveStartSelection() {
            const param = new URLSearchParams(location.search).get('day');
            if (param !== null) {
                const hit = manifest.days.find(d => d.day === parseInt(param, 10));
                if (hit) return { scope: 'single', start: hit.id, end: hit.id };
            }
            try {
                const saved = JSON.parse(localStorage.getItem(LAST_RANGE_KEY));
                if (saved && dayEntry(saved.start) && dayEntry(saved.end)) {
                    return { scope: saved.scope === 'range' ? 'range' : 'single', start: saved.start, end: saved.end };
                }
            } catch (e) { /* 무시 */ }
            // 이전 버전이 저장한 마지막 Day를 이어받음
            try {
                const last = localStorage.getItem('delta:lastDay');
                if (dayEntry(last)) return { scope: 'single', start: last, end: last };
            } catch (e) { /* 무시 */ }
            return { scope: 'single', start: DEFAULT_DAY_ID, end: DEFAULT_DAY_ID };
        }

        function showLoadError(err) {
            console.error(err);
            const isFile = location.protocol === 'file:';
            document.getElementById('setup-hint').innerText = isFile
                ? '로컬 서버로 열어 주세요 (file:// 에서는 데이터를 읽을 수 없습니다)'
                : '데이터를 불러오지 못했습니다. 새로고침해 주세요';
            document.querySelector('#setup-screen button[onclick="startStudy()"]').disabled = true;
        }

        // 💾 진행 저장 (같은 브라우저 안에서만 유지되는 개인 편의 기능)
        // 한 칸(마지막 연습)만 쓴다. 저장 값은 문항 ID 순서라서 기간을 따로 기억할 필요가 없다.
        const PROGRESS_KEY = 'delta:progress';
        // 틀린 문제는 Day별로 저장한다 (문항 ID에 Day가 들어 있음). 기간은 연습할 때만 거른다.
        const wrongKey = dayId => `delta:${dayId}:wrong`;
        let wrongSet = new Set(); // 모든 Day의 틀린 문항 ID (마지막 채점이 '틀림'인 문항)

        // 이전 버전(Day08 인덱스 기반) 틀린 문제를 ID 기반으로 한 번 옮긴다 (Day08을 불러온 경우에만)
        function migrateLegacy() {
            const items = dayCache.get('day08');
            if (!items) return;
            try {
                const legacyWrong = 'delta-day08-wrong';
                const oldWrong = localStorage.getItem(legacyWrong);
                if (oldWrong !== null) {
                    if (localStorage.getItem(wrongKey('day08')) === null) {
                        const idxs = JSON.parse(oldWrong);
                        const ids = (Array.isArray(idxs) ? idxs : []).filter(i => items[i]).map(i => items[i].id);
                        localStorage.setItem(wrongKey('day08'), JSON.stringify(ids));
                    }
                    localStorage.removeItem(legacyWrong);
                }
            } catch (e) { /* 변환 실패 시 옛 키를 그대로 두고 넘어감 */ }
            // 가장 오래된 진행 저장(인덱스 기반) → 한 칸 저장으로 옮김
            try {
                const legacyProgress = 'delta-day08-progress';
                const oldProgress = localStorage.getItem(legacyProgress);
                if (oldProgress !== null) {
                    if (localStorage.getItem(PROGRESS_KEY) === null) {
                        const s = JSON.parse(oldProgress);
                        if (s && Array.isArray(s.order)) {
                            const order = s.order.filter(i => items[i]).map(i => items[i].id);
                            localStorage.setItem(PROGRESS_KEY, JSON.stringify({
                                scope: 'single', start: 'day08', end: 'day08', label: 'Day 08 · 사다리', word: 'Step',
                                playMode: s.playMode, poolMode: 'all', parity: 'all',
                                chunkSize: s.unit === 'group' ? 0 : (s.chunkSize || 4), grade: false, order, currentIdx: s.currentIdx || 0
                            }));
                        }
                    }
                    localStorage.removeItem(legacyProgress);
                }
            } catch (e) { /* 변환 실패 시 옛 키를 그대로 둠 */ }
        }

        // 이전 버전의 Day별 진행 저장(delta:dayNN:progress)을 한 칸으로 옮긴다 (마지막 Day 것을 우선)
        function migrateProgress() {
            try {
                if (localStorage.getItem(PROGRESS_KEY) !== null) return;
                const lastDay = localStorage.getItem('delta:lastDay');
                const found = [lastDay, ...manifest.days.map(d => d.id)]
                    .filter(id => id && localStorage.getItem(`delta:${id}:progress`) !== null)[0];
                if (found) {
                    const s = JSON.parse(localStorage.getItem(`delta:${found}:progress`));
                    if (s && Array.isArray(s.order) && s.order.length > 0) {
                        const mode = s.playMode === 'random' ? '랜덤' : '사다리';
                        localStorage.setItem(PROGRESS_KEY, JSON.stringify({
                            scope: 'single', start: found, end: found,
                            label: `${dayLabel(found)} · ${mode}`,
                            word: s.dialogue ? 'Set' : 'Step',
                            playMode: s.playMode, poolMode: s.poolMode || 'all', parity: s.parity || 'all',
                            chunkSize: s.unit === 'group' ? 0 : (s.chunkSize || 4),
                            grade: !!s.grade, order: s.order, currentIdx: s.currentIdx || 0
                        }));
                    }
                }
                manifest.days.forEach(d => localStorage.removeItem(`delta:${d.id}:progress`));
            } catch (e) { /* 변환 실패 시 옛 저장을 그대로 둠 */ }
        }

        function saveProgress() {
            try {
                localStorage.setItem(PROGRESS_KEY, JSON.stringify({
                    scope, start: selStart, end: selEnd,
                    label: `${selectionLabel()} · ${sessionLabel()}`,
                    word: dayUnit() === '문장' ? 'Step' : 'Set',
                    playMode, poolMode, parity,
                    chunkSize: selectedChunkSize,
                    grade: gradeOn,
                    order: studySequence.map(s => s.data.id),
                    currentIdx
                }));
            } catch (e) { /* 저장 불가 환경(사생활 보호 모드 등)에서는 무시 */ }
        }

        function loadProgress() {
            try {
                const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY));
                return saved && Array.isArray(saved.order) && saved.order.length > 0 ? saved : null;
            } catch (e) { return null; }
        }

        function clearProgress() {
            try { localStorage.removeItem(PROGRESS_KEY); } catch (e) { /* 무시 */ }
        }

        function loadAllWrong() {
            wrongSet = new Set();
            for (const entry of manifest.days) {
                try {
                    const arr = JSON.parse(localStorage.getItem(wrongKey(entry.id)));
                    if (Array.isArray(arr)) arr.forEach(id => wrongSet.add(id));
                } catch (e) { /* 무시 */ }
            }
        }

        // Day별로 나눠서 저장한다. 틀린 문제가 없는 Day의 키는 지운다
        function saveWrong() {
            for (const entry of manifest.days) {
                const prefix = `${entry.id}:`;
                const ids = [...wrongSet].filter(id => id.startsWith(prefix));
                try {
                    if (ids.length) localStorage.setItem(wrongKey(entry.id), JSON.stringify(ids));
                    else localStorage.removeItem(wrongKey(entry.id));
                } catch (e) { /* 무시 */ }
            }
        }

        // 이어서 연습: 저장된 범위와 설정을 그대로 복원한다
        async function resumeStudy() {
            const saved = loadProgress();
            if (!saved || !dayEntry(saved.start) || !dayEntry(saved.end)) return;
            scope = saved.scope === 'range' ? 'range' : 'single';
            selStart = saved.start;
            selEnd = saved.end;
            try {
                await loadSelection();
            } catch (err) {
                console.error(err);
                alert('저장된 범위의 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
                return;
            }
            playMode = saved.playMode;
            poolMode = saved.poolMode || 'all';
            parity = saved.parity || 'all';
            selectedChunkSize = saved.chunkSize ?? 4;
            gradeOn = !!saved.grade;
            studySequence = saved.order.filter(id => itemById.has(id)).map(id => ({ data: itemById.get(id) }));
            currentIdx = Math.min(saved.currentIdx, studySequence.length - 1);
            updateTitles();
            enterStudy(); // 대화형은 세트의 처음(A 문제)부터 다시 시작
        }

        // 🏠 홈: 진행은 그대로 두고 처음 화면으로 (설정 화면의 이어서 연습하기로 돌아올 수 있음)
        function goHome() {
            location.reload();
        }

        // 🚪 완료 화면 종료: 끝난 연습이므로 진행 저장을 지우고 처음 화면으로
        function quitStudy() {
            clearProgress();
            location.reload();
        }

        // ── 영작 모드 ─────────────────────────────────────────
        // 대소문자, 구두점, 축약형(don't → do not)을 정규화해서 비교
        function normalizeEn(s) {
            return s.toLowerCase()
                .replace(/[‘’]/g, "'")
                .replace(/n't\b/g, ' not')
                .replace(/[^a-z0-9' ]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // 이번 방문(같은 항목에 머무는 동안)의 채점 결과: 단계 번호 → 맞음(true)/틀림(false)
        let visitIdx = -1;
        let visitJudged = {};

        // 현재 질문 단계를 채점하고 결과를 표시. 빈 답안은 채점하지 않음
        // 오답 목록은 항목(세트) 단위: 이번 방문에서 하나라도 틀리면 오답, 채점한 모든 단계가 맞으면 제거
        function judgeCurrent() {
            const judgeEl = document.getElementById('judge-text');
            const input = document.getElementById('answer-input');
            const item = studySequence[currentIdx].data;
            const typed = input.value.trim();

            if (!typed) {
                judgeEl.classList.add('hidden');
                return;
            }
            const ok = normalizeEn(typed) === normalizeEn(answerFor(item, subStep));
            visitJudged[subStep] = ok;
            const results = Object.values(visitJudged);
            if (results.includes(false)) wrongSet.add(item.id);
            else if (results.length && results.every(Boolean)) wrongSet.delete(item.id);
            saveWrong();

            if (ok) {
                judgeEl.className = 'text-sm font-black mb-3 break-keep px-4 text-emerald-600';
                judgeEl.innerText = '✅ 맞음';
            } else {
                judgeEl.className = 'text-sm font-black mb-3 break-keep px-4 text-rose-500';
                judgeEl.innerText = `❌ 틀림 · 내 답: ${typed}`;
            }
        }

        // 직전 항목 요약 (대화형은 A/B 대사를 함께 표시)
        function renderPrevBox() {
            const prevBox = document.getElementById('prev-item-box');
            if (currentIdx > 0) {
                const prev = studySequence[currentIdx - 1].data;
                if (isDialogueItem(prev)) {
                    document.getElementById('prev-kr').innerText = `Last: A: ${prev.a_kr} / B: ${prev.b_kr}`;
                    document.getElementById('prev-en').innerText = `A: ${prev.a_en} / B: ${prev.b_en}`;
                } else {
                    document.getElementById('prev-kr').innerText = "Last: " + prev.kr;
                    document.getElementById('prev-en').innerText = prev.en;
                }
                prevBox.classList.remove('opacity-0');
                prevBox.classList.add('opacity-40');
            } else {
                prevBox.classList.remove('opacity-40');
                prevBox.classList.add('opacity-0');
            }
        }

        // 현재 단계(subStep)에 맞춰 화면을 그림
        function renderStep(item) {
            const question = isQuestionStep();
            const dlg = isDialogueItem(item);
            const mixedDay = dayUnit() === '세트';
            const speaker = document.getElementById('speaker-badge');
            const roleTag = document.getElementById('role-tag');
            const contextBox = document.getElementById('context-box');
            const krBox = document.getElementById('kr-box');
            const enText = document.getElementById('en-text');
            const mainBtn = document.getElementById('main-btn');

            if (!dlg) {
                // 문장형: 혼합 Day 안의 문장은 초록 배지로 구분, 문장형 Day는 배지 없음
                roleTag.classList.add('hidden');
                contextBox.classList.add('hidden');
                speaker.innerText = '문장';
                speaker.className = 'px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-tight text-white bg-emerald-600';
                speaker.classList.toggle('hidden', !mixedDay);
                krBox.innerText = item.kr;
                enText.innerText = item.en;
                mainBtn.innerText = question ? '정답 확인' : '다음 단계';
            } else {
                const isA = subStep < 2;
                speaker.classList.remove('hidden');
                roleTag.classList.remove('hidden');
                if (isA) {
                    speaker.innerText = 'A 질문';
                    speaker.className = 'px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-tight text-white bg-blue-600';
                    roleTag.innerText = 'A';
                    roleTag.className = 'w-7 h-7 rounded-full text-white font-black text-xs flex items-center justify-center shadow-sm shrink-0 bg-blue-600';
                    contextBox.classList.add('hidden');
                    krBox.innerText = item.a_kr;
                    enText.innerText = item.a_en;
                    mainBtn.innerText = question ? 'A 정답 확인' : 'B 문제 풀기 →';
                } else {
                    speaker.innerText = 'B 답변';
                    speaker.className = 'px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-tight text-white bg-orange-500';
                    roleTag.innerText = 'B';
                    roleTag.className = 'w-7 h-7 rounded-full text-white font-black text-xs flex items-center justify-center shadow-sm shrink-0 bg-orange-500';
                    // B 차례에는 A의 질문을 맥락으로 보여 줌
                    document.getElementById('context-kr').innerText = 'A: ' + item.a_kr;
                    document.getElementById('context-en').innerText = item.a_en;
                    contextBox.classList.remove('hidden');
                    krBox.innerText = item.b_kr;
                    enText.innerText = item.b_en;
                    mainBtn.innerText = question ? 'B 정답 확인' : '다음 세트 →';
                }
            }

            // 정답 공개 여부
            const enBox = document.getElementById('en-box');
            enBox.classList.toggle('invisible', question);
            enBox.classList.toggle('opacity-0', question);

            // 영작 입력: 질문 단계에서만 입력 가능 (새 질문이면 초기화)
            const answerBox = document.getElementById('answer-box');
            const input = document.getElementById('answer-input');
            answerBox.classList.toggle('hidden', !gradeOn);
            if (question) {
                input.value = '';
                input.disabled = false;
                document.getElementById('judge-text').classList.add('hidden');
                if (gradeOn) input.focus({ preventScroll: true });
            } else {
                input.disabled = true;
                if (document.activeElement === input) input.blur(); // 뒤이은 Space/Enter가 단축키로 가도록
            }
        }

        function render() {
            stopAutoGauge();
            const item = studySequence[currentIdx].data;

            // 같은 항목에 머무는 동안만 채점 결과를 유지 (세트 단위 오답 판정)
            if (visitIdx !== currentIdx) {
                visitIdx = currentIdx;
                visitJudged = {};
            }

            renderPrevBox();

            const dlg = isDialogueItem(item);
            const unit = dayUnit() === '세트' ? 'Set' : 'Step';
            document.getElementById('sentence-number').innerText = `No.${item.num}`;
            document.getElementById('progress-text').innerText = `${unit} ${currentIdx + 1} / ${studySequence.length}`;
            // 문항이 1개일 때 0으로 나누지 않도록 분모를 최소 1로 보정
            document.getElementById('progress-bar').style.width = `${((currentIdx) / Math.max(1, studySequence.length - 1)) * 100}%`;
            document.getElementById('study-card').classList.toggle('card-tall', dayUnit() === '세트');

            renderStep(item);

            const prevBtn = document.getElementById('prev-btn');
            const canGoBack = currentIdx > 0 || (dlg && subStep > 0);
            prevBtn.classList.toggle('text-slate-300', !canGoBack);
            prevBtn.classList.toggle('pointer-events-none', !canGoBack);
            prevBtn.classList.toggle('text-slate-600', canGoBack);

            saveProgress();
            if (isAutoMode) {
                const t = timingFor(item);
                runAutoGauge(isQuestionStep() ? t.think : t.confirm);
            }
        }

        function handleAction() {
            stopAutoGauge();
            const item = studySequence[currentIdx].data;

            if (isQuestionStep()) {
                // 질문 단계: 영작 모드면 채점한 뒤 정답을 공개
                if (gradeOn) judgeCurrent();
                subStep++;
                render();
                return;
            }
            // 정답 공개 단계: 항목 안에 남은 단계가 있으면 다음 단계로
            if (subStep < stepsOf(item) - 1) {
                subStep++;
                render();
                return;
            }
            // 항목 끝 → 다음 문장/세트
            subStep = 0;
            currentIdx++;
            if (currentIdx < studySequence.length) render();
            else finishStudy();
        }

        function prevStep() {
            const item = studySequence[currentIdx].data;
            // 대화형은 세트 안에서 한 단계씩 되돌림
            if (isDialogueItem(item) && subStep > 0) {
                subStep--;
                render();
                return;
            }
            // 이전 항목으로: 대화형은 마지막 단계(B 정답)에서, 문장형은 처음 단계에서 시작
            if (currentIdx > 0) {
                currentIdx--;
                subStep = isDialogueItem(studySequence[currentIdx].data) ? 3 : 0;
                render();
            }
        }

        function initProgressControl() {
            const container = document.getElementById('progress-container');
            const seek = (e) => {
                const rect = container.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                let percent = x / rect.width;
                percent = Math.max(0, Math.min(1, percent));
                const newIdx = Math.round(percent * (studySequence.length - 1));
                if (newIdx !== currentIdx) {
                    currentIdx = newIdx;
                    subStep = 0;
                    render();
                }
            };
            container.addEventListener('mousedown', (e) => {
                seek(e);
                const onMouseMove = (moveEvent) => seek(moveEvent);
                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
            container.addEventListener('touchstart', (e) => {
                seek(e);
                const onTouchMove = (moveEvent) => {
                    moveEvent.preventDefault();
                    seek(moveEvent);
                };
                const onTouchEnd = () => {
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd);
            });
        }

        // 🧹 틀린 문제 목록 정리 (완료 화면, 틀린 문제로 연습한 경우에만)
        let sessionFromWrong = false; // 이번 연습이 '틀린 문제' 범위인지
        let pickedWrong = new Set();  // "맞은 문제만 고르기"에서 체크한 ID

        // 이번 연습에 나온 문항 중 아직 목록에 있는 것 (중복 제거, 교재 순서)
        function sessionWrongItems() {
            const items = studySequence.map(s => s.data);
            return items.filter((item, i) => wrongSet.has(item.id) && items.findIndex(x => x.id === item.id) === i);
        }

        function showWrongMsg(text) {
            const msg = document.getElementById('wrong-cleanup-msg');
            msg.innerText = text;
            msg.classList.toggle('hidden', !text);
        }

        function renderWrongPick() {
            const list = document.getElementById('wrong-pick-list');
            const items = sessionWrongItems();
            list.innerHTML = '';
            // 정리할 문제가 없으면 체크/삭제 버튼 대신 홈으로 돌아가기 버튼
            const empty = items.length === 0;
            document.getElementById('wrong-actions').classList.toggle('hidden', empty);
            document.getElementById('wrong-select-row').classList.toggle('hidden', empty);
            document.getElementById('wrong-home-btn').classList.toggle('hidden', !empty);
            if (empty) {
                list.innerHTML = '<p class="text-xs font-bold text-slate-400 text-center py-3">정리할 문제가 없습니다.</p>';
                return;
            }
            items.forEach(item => {
                const label = document.createElement('label');
                label.className = 'flex items-center gap-3 min-h-[44px] px-3 py-2 rounded-xl border-2 border-slate-100 cursor-pointer';
                const box = document.createElement('input');
                box.type = 'checkbox';
                box.className = 'w-5 h-5 shrink-0 accent-blue-600';
                box.checked = pickedWrong.has(item.id);
                box.onchange = () => { box.checked ? pickedWrong.add(item.id) : pickedWrong.delete(item.id); syncSelectAllWrong(); };
                const text = document.createElement('span');
                text.className = 'text-xs font-bold text-slate-700 break-keep';
                text.innerText = `${item.num}  ${item.kr || item.a_kr}`;
                label.append(box, text);
                list.appendChild(label);
            });
            syncSelectAllWrong();
        }

        // 완료 화면 두 단계: 요약(main) ↔ 틀린 문제 정리(cleanup)
        function showFinishView(view) {
            const cleanup = view === 'cleanup';
            document.getElementById('finish-main').classList.toggle('hidden', cleanup);
            document.getElementById('finish-cleanup').classList.toggle('hidden', !cleanup);
            document.getElementById('finish-cleanup').classList.toggle('flex', cleanup);
            if (cleanup) { pickedWrong = new Set(); showWrongMsg(''); renderWrongPick(); }
        }

        // 전체 선택 체크박스: 모두 체크되면 체크, 하나라도 빠지면 해제 상태로 표시
        function syncSelectAllWrong() {
            const items = sessionWrongItems();
            const all = document.getElementById('wrong-select-all');
            all.checked = items.length > 0 && items.every(item => pickedWrong.has(item.id));
            document.getElementById('wrong-select-text').innerText = `전체 선택 (${pickedWrong.size}/${items.length})`;
        }

        function toggleSelectAllWrong(on) {
            pickedWrong = new Set(on ? sessionWrongItems().map(item => item.id) : []);
            renderWrongPick();
        }

        function removePickedWrong() {
            if (pickedWrong.size === 0) { showWrongMsg('지울 문제를 먼저 체크해 주세요.'); return; }
            const n = pickedWrong.size;
            pickedWrong.forEach(id => wrongSet.delete(id));
            pickedWrong = new Set();
            saveWrong();
            renderWrongPick();
            showWrongMsg(`${n}개를 목록에서 지웠습니다.`);
        }

        function clearWrongAll() {
            if (wrongSet.size === 0) { showWrongMsg('목록이 이미 비어 있습니다.'); return; }
            if (!confirm(`틀린 문제 ${wrongSet.size}개를 모두 지울까요?`)) return;
            wrongSet.clear();
            saveWrong();
            renderWrongPick();
            showWrongMsg('틀린 문제 목록을 비웠습니다.');
        }

        function finishStudy() {
            stopAutoGauge();
            document.getElementById('finish-ui').classList.remove('hidden');
            document.getElementById('prev-item-box').classList.add('hidden');
            document.getElementById('control-panel').style.display = 'none';

            clearProgress();

            // 틀린 문제로 연습했을 때만 목록 정리 버튼을 보여 줌
            document.getElementById('wrong-open-btn').classList.toggle('hidden', !sessionFromWrong);
            showFinishView('main');

            const btn = document.getElementById('cal-confirm-btn');
            btn.onclick = function() {
                const input = prompt("며칠 뒤에 복습 알림을 예약할까요? (1~30)", "1");
                if (input === null) return;
                const days = Number(input.trim());
                if (!Number.isInteger(days) || days < 1 || days > 30) {
                    alert("1~30 사이의 정수를 입력해 주세요.");
                    return;
                }
                const targetDate = new Date();
                targetDate.setDate(targetDate.getDate() + days);
                // 한국 시간 기준 날짜를 쓰기 위해 toISOString(UTC) 대신 로컬 날짜를 조합
                const yyyy = targetDate.getFullYear();
                const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
                const dd = String(targetDate.getDate()).padStart(2, '0');
                const dateStr = `${yyyy}${mm}${dd}`;
                const title = encodeURIComponent(`[복습] Delta ${selectionLabel()} (${sessionLabel()})`);
                const details = encodeURIComponent(`셀프 드릴링 복습하기!\n\n🔗 주소: ${window.location.href}`);
                location.href = `https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${dateStr}T090000/${dateStr}T100000`;
            };
        }

        // 🌙 다크 모드: 선택값은 기기(브라우저)에 저장하고, 실패해도 화면은 동작
        const THEME_KEY = 'delta:theme';
        function applyTheme(dark) {
            document.documentElement.classList.toggle('dark', dark);
            // 상태 표시: 라이트면 해 + 라이트, 다크면 달 + 다크 (영작 모드 알약과 같은 스위치 모양)
            const btn = document.getElementById('theme-toggle');
            btn.setAttribute('aria-checked', String(dark));
            btn.innerHTML = `<span><span class="text-base leading-none">${dark ? '🌙' : '☀️'}</span>${dark ? '다크' : '라이트'}</span>
                <span class="relative inline-flex h-6 w-10 shrink-0 items-center rounded-full transition-colors ${dark ? 'bg-blue-600' : 'bg-slate-200'}">
                    <span class="inline-block h-5 w-5 rounded-full bg-white shadow transition-transform ${dark ? 'translate-x-5' : 'translate-x-0.5'}"></span>
                </span>`;
        }
        function toggleTheme() {
            const dark = !document.documentElement.classList.contains('dark');
            applyTheme(dark);
            try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch (e) { /* 무시 */ }
        }
        applyTheme(document.documentElement.classList.contains('dark'));

        // ⌨️ 키보드 단축키: Space/Enter 다음 단계, ← 이전 (학습 화면에서만 동작)
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('study-screen').classList.contains('hidden')) return;
            if (document.getElementById('finish-ui').classList.contains('hidden') === false) return;
            if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                if (e.repeat) return;
                // 포커스된 버튼이 키 입력으로 한 번 더 클릭되는 것을 막기 위해 포커스 해제
                if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                handleAction();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                prevStep();
            }
        });

        // 📊 방문 집계: 익명 ID(브라우저 `delta:vid`, 탭 세션 `sessionStorage`)만 보낸다. 학습 내용·입력 텍스트는 보내지 않는다.
        // 전송이 실패해도 앱 동작에는 영향이 없다 (모든 호출은 조용히 무시).
        const TRACK_VID_KEY = 'delta:vid';
        const TRACK_SID_KEY = 'delta:sid';
        const TRACK_HEARTBEAT_MS = 30000;
        let trackVid = null;
        let trackSessionId = null;
        let trackTimer = null;
        function trackOn() {
            return !!TRACK_CONFIG.url && TRACK_CONFIG.hosts.includes(location.hostname);
        }
        function newTrackId() {
            return crypto.randomUUID ? crypto.randomUUID() : `t${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
        }
        function trackSend(path, body) {
            // publishable 키는 apikey 헤더로만 보낸다 (Authorization: Bearer 에 넣으면 401)
            const headers = { 'Content-Type': 'application/json', apikey: TRACK_CONFIG.key };
            try {
                fetch(`${TRACK_CONFIG.url}/rest/v1/${path}`, { method: 'POST', headers, body: JSON.stringify(body), keepalive: true }).catch(() => {});
            } catch (e) { /* 무시 */ }
        }
        function sendHeartbeat() {
            if (!trackOn() || !trackSessionId || document.visibilityState !== 'visible') return;
            trackSend('rpc/touch_heartbeat', { p_session_id: trackSessionId, p_vid: trackVid });
        }
        function initTracking() {
            if (!trackOn() || trackTimer) return;
            try { trackVid = localStorage.getItem(TRACK_VID_KEY) || newTrackId(); localStorage.setItem(TRACK_VID_KEY, trackVid); } catch (e) { trackVid = trackVid || newTrackId(); }
            let sid = null;
            try { sid = sessionStorage.getItem(TRACK_SID_KEY); } catch (e) { /* 무시 */ }
            const isNewSession = !sid;
            trackSessionId = sid || newTrackId();
            try { sessionStorage.setItem(TRACK_SID_KEY, trackSessionId); } catch (e) { /* 무시 */ }
            // 방문(visit)은 탭 세션당 1회만 기록한다. 새로고침은 같은 방문으로 본다.
            if (isNewSession) trackSend('visits', { vid: trackVid, session_id: trackSessionId, is_mobile: /Mobi|Android|iPhone/i.test(navigator.userAgent) });
            sendHeartbeat();
            trackTimer = setInterval(sendHeartbeat, TRACK_HEARTBEAT_MS);
            document.addEventListener('visibilitychange', sendHeartbeat);
        }

        window.onload = async () => {
            initTracking();
            // 영작 입력창: Enter로 채점 및 정답 공개
            document.getElementById('answer-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.isComposing) {
                    e.preventDefault();
                    if (isQuestionStep()) handleAction();
                }
            });
            // 범위 선택: 단일 Day 드롭다운, 기간의 시작·끝 드롭다운
            document.getElementById('day-select').addEventListener('change', (e) => applySelection('single', e.target.value, e.target.value));
            document.getElementById('range-start').addEventListener('change', (e) => applyRange(e.target.value, selEnd));
            document.getElementById('range-end').addEventListener('change', (e) => applyRange(selStart, e.target.value));

            try {
                await loadManifest();
                const start = resolveStartSelection();
                scope = start.scope;
                selStart = start.start;
                selEnd = start.end;
                await loadSelection();
            } catch (err) {
                showLoadError(err);
                return;
            }
            // 옛 저장 변환에 Day 08 문항이 필요하므로, 옛 키가 남아 있을 때만 먼저 받아 둔다
            if (localStorage.getItem('delta-day08-progress') !== null || localStorage.getItem('delta-day08-wrong') !== null) {
                await fetchDayItems('day08').catch(() => {});
            }
            migrateLegacy();
            migrateProgress();
            loadAllWrong();
            applyDayUI();
            renderSelectors();
            applyGradeUI();
            refreshSetup();
            updateResumeButton();
        };
    </script>
</body>
</html>
